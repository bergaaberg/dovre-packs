[package]
name = "wasm-canary"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
similar = { version = "2", default-features = false, features = ["text"] }
# Pinned to the wasm-bindgen CLI build.sh runs: the two must match exactly.
wasm-bindgen = "=0.2.129"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
