name: Agent Harness Support
description: Request or improve support for a local coding agent CLI harness
title: "[harness]: "
labels: ["harness"]
body:
  - type: input
    id: cli
    attributes:
      label: Agent CLI binary & version
      placeholder: e.g. codex 0.1.x, agy, claude, omp, copilot
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Session discovery, headless JSON stream format, or resume behavior
    validations:
      required: true
